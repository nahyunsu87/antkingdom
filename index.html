<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1026">
<meta name="apple-mobile-web-app-title" content="개미 체육관">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>개미 체육관</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="stage"></canvas>

<div id="boot" class="overlay">
  <h1>🐜 개미 체육관</h1>
  <p class="sub">몸으로 노는 놀이 16가지 · 아이 1~2명 (만 4세~)</p>
  <p id="homeTip" class="tip">주소창 없이 쓰려면: Safari 아래 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b> → 홈 화면의 🐜 아이콘으로 실행</p>
  <ol>
    <li>아이폰을 <b>가로로</b> TV장 위에 세우고, 화면 미러링을 켭니다</li>
    <li>아이가 카메라에서 <b>1.5~2m</b> 떨어져 서게 합니다. <b>어른은 화면 밖</b>으로</li>
    <li>놀이는 어른이 <b>화면을 눌러</b> 골라 주세요. 소리를 켜야 말로 안내합니다</li>
  </ol>
  <button id="startBtn">카메라 켜고 시작</button>
  <p id="status"></p>
</div>

<div id="rotate" class="overlay">📱↻<br>폰을 가로로 돌려주세요</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
