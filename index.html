<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1026">
<title>개미 체육관</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="stage"></canvas>

<div id="boot" class="overlay">
  <h1>🐜 개미 체육관</h1>
  <p class="sub">카메라 앞에서 몸으로 하는 운동 게임 · 1~2인</p>
  <ol>
    <li>아이폰을 <b>가로로</b> TV 아래에 세우고, 화면 미러링을 켭니다</li>
    <li>전면 카메라에서 <b>2~3m</b> 떨어져 무릎까지 보이게 섭니다</li>
    <li>메뉴는 <b>손을 들어 1초간 올려두면</b> 선택됩니다</li>
  </ol>
  <button id="startBtn">카메라 켜고 시작</button>
  <p id="status"></p>
</div>

<div id="rotate" class="overlay">📱↻<br>폰을 가로로 돌려주세요</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
